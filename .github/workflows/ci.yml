name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The stable release current at bootstrap (spec §4.11); pinned so that new
  # lints do not break `clippy -D warnings` without a deliberate upgrade.
  RUSTUP_TOOLCHAIN: "1.91.1"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # wayland-client's system backend links libwayland-client via pkg-config;
      # the text module links libfontconfig, the input module libxkbcommon,
      # whose unit tests compile keymaps from xkb-data. The runner has no GPU: Mesa's
      # lavapipe (mesa-vulkan-drivers) gives the renderer's offscreen tests a
      # software Vulkan adapter. Text goldens use the fonts in tests/fonts/.
      # zsh and fish run the shell completions' tests (tests/completions.rs).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev pkg-config \
            libfontconfig-dev libxkbcommon-dev xkb-data libvulkan1 mesa-vulkan-drivers \
            zsh fish

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      # Unit tests and the offscreen goldens (render, golden_harness, text,
      # icons). A missing adapter fails these backends instead of skipping
      # them; the GL test still skips here (no EGL on the runner). The E2E
      # and latency tests print SKIPPED here: they run in `headless` below.
      - name: cargo test (unit, golden)
        env:
          LOGIS_TEST_REQUIRE_BACKENDS: auto,vulkan,software
        run: cargo test --locked

      - name: Keep golden mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-check
          path: target/tmp/golden-failures/
          if-no-files-found: ignore

  # End to end and latency in sway on wlroots' headless backend (spec §5,
  # owner decision on e32f9347): installed on this runner only. The harness
  # starts sway itself (WLR_BACKENDS=headless, pixman renderer, no input
  # devices, one 1280x720 output) in a scratch XDG_RUNTIME_DIR; logis
  # renders on lavapipe and presents through Vulkan WSI over wl_shm.
  headless:
    name: headless E2E and latency (sway)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOGIS_E2E: sway
    steps:
      - uses: actions/checkout@v5

      # sway brings wlroots and xkb-data (the injector's keymap includes
      # resolve there). No swaybg: sway shows its default dark grey, which the
      # harness covers with its own black backdrop surface.
      - name: Install sway and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sway libwayland-dev pkg-config \
            libfontconfig-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
          sway --version

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: E2E (cargo test --test e2e)
        run: cargo test --locked --test e2e -- --nocapture

      # logis --dmenu against a real daemon whose window this compositor shows.
      - name: dmenu E2E (cargo test --test dmenu)
        run: cargo test --locked --test dmenu -- --nocapture

      # logis --provider with the fixture provider (tests/fixtures/providers).
      - name: provider E2E (cargo test --test provider_window)
        run: cargo test --locked --test provider_window -- --nocapture

      # logis --apps over fixture applications: the launched fixture program
      # records the compositor's activation token and outlives the daemon.
      - name: App launcher E2E (cargo test --test apps_window)
        run: cargo test --locked --test apps_window -- --nocapture

      # logis --servitor with the fake servitor (tests/fixtures/servitor).
      - name: servitor E2E (cargo test --test servitor_window)
        run: cargo test --locked --test servitor_window -- --nocapture

      # Hover, click, wheel and finger scrolling through a virtual pointer,
      # and clipboard and primary paste from the harness's own selection
      # owner (wlr-data-control; no wl-clipboard on the runner).
      - name: Pointer and paste E2E (cargo test --test pointer)
        run: cargo test --locked --test pointer -- --nocapture

      # Open/close transitions and the gliding selection, paced by this
      # compositor's frame callbacks; an idle window wakes nothing. sway
      # offers no ext-background-effect, so no blur region may be set.
      - name: Motion E2E (cargo test --test motion)
        run: cargo test --locked --test motion -- --nocapture

      # A theme edited and broken under a visible window; continuous
      # effects keep it drawing until reduce-motion stills them.
      - name: Theme E2E (cargo test --test theme_window)
        run: cargo test --locked --test theme_window -- --nocapture

      # Relative trend only: budgets are recorded, never enforced here
      # (absolute budgets are checked on the owner's machine with
      # LOGIS_LATENCY_BUDGETS=enforce). The table lands in the job summary.
      - name: Latency (cargo test --release --test latency)
        env:
          LOGIS_LATENCY_RUNS: "20"
          LOGIS_LATENCY_REPORT: ${{ github.workspace }}/latency.jsonl
        run: cargo test --locked --release --test latency -- --nocapture

      - name: Keep latency samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-${{ github.sha }}
          path: latency.jsonl
          if-no-files-found: ignore

      - name: Keep golden mismatches
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-headless
          path: target/tmp/golden-failures/
          if-no-files-found: ignore
