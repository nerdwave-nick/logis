name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The stable release current at bootstrap (spec §4.11); pinned so that new
  # lints do not break `clippy -D warnings` without a deliberate upgrade.
  RUSTUP_TOOLCHAIN: "1.91.1"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # wayland-client's system backend links libwayland-client via pkg-config;
      # the text module links libfontconfig. The runner has no GPU: Mesa's
      # lavapipe (mesa-vulkan-drivers) gives the renderer's offscreen tests a
      # software Vulkan adapter. Text goldens use the fonts in tests/fonts/.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-dev pkg-config \
            libfontconfig-dev libvulkan1 mesa-vulkan-drivers

      - name: Install Rust ${{ env.RUSTUP_TOOLCHAIN }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      # A missing adapter fails these backends instead of skipping them; the
      # GL test still skips here (no EGL on the runner).
      - name: cargo test
        env:
          LOGIS_TEST_REQUIRE_BACKENDS: auto,vulkan,software
        run: cargo test --locked
