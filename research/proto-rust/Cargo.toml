[package]
name = "logis-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
bytemuck = "1.25.2"
cosmic-text = "0.19.0"
glyphon = "0.12"
libc = "0.2.190"
pollster = "1.0.1"
raw-window-handle = "0.6"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
tiny-skia = "0.12.0"
vello = "0.11.0"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
