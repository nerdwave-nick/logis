[package]
name = "logis"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A grimdark Wayland launcher and dmenu-compatible picker"
license = "MIT"
repository = "https://github.com/nerdwave-nick/logis"
readme = "README.md"
# research/ is disposable evidence with its own Cargo package; never ship it.
exclude = ["/research", "/.github"]

[dependencies]
# The Wayland client of the decided stack (ADR 0001), lowest layer only: the
# system backend (libwayland-client) that GPU presentation will need.
wayland-client = { version = "0.31.15", features = ["system"] }
# Layer shell, outputs and surfaces on top of wayland-client (ADR 0001). Its
# default calloop and xkbcommon features stay off until a slice needs them;
# `system` keeps the libwayland-client backend that GPU presentation requires.
# Its `reexports::protocols` provides fractional-scale and viewporter.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["system"] }
# The GPU (ADR 0001): Vulkan first, then GL (gles), shaders in WGSL only. No
# DX12/Metal/WebGPU backends; `raw-window-handle` comes re-exported as `wgpu::rwh`.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
# The client <-> daemon session protocol is length-prefixed JSON frames
# (src/protocol). serde is in the decided core set (spec §4.11) and the provider
# protocol (§4.8) and the JSONC config (§4.9) need it too; serde_json saves a
# hand-written JSON parser and escaper.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# Already in the tree through wayland-client; the `stdio` feature adds dup2 so
# a daemon started by a client can move its stderr off the client's pipe once
# listening (libraries such as wayland-backend print to stderr, and printing
# to a broken pipe panics).
rustix = { version = "1.1.5", features = ["stdio"] }

# research/proto-rust is a separate, disposable Cargo package. Keeping the root
# an explicit workspace that excludes it means neither cargo invocation captures
# the other.
[workspace]
exclude = ["research/proto-rust"]

[dev-dependencies]
# Goldens are checked-in PNGs (compressed, viewable in any tool and on
# GitHub); a PNG decoder needs inflate, which std lacks. The same release the
# text and icon slices use, so the tree holds one copy.
png = "0.18"
