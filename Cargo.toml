[package]
name = "logis"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A grimdark Wayland launcher and dmenu-compatible picker"
license = "MIT"
repository = "https://github.com/nerdwave-nick/logis"
readme = "README.md"
# research/ is disposable evidence with its own Cargo package; never ship it.
exclude = ["/research", "/.github"]

[dependencies]
# The Wayland client of the decided stack (ADR 0001), lowest layer only: the
# system backend (libwayland-client) that GPU presentation will need.
wayland-client = { version = "0.31.15", features = ["system"] }
# Layer shell, outputs and surfaces on top of wayland-client (ADR 0001). Its
# default calloop and xkbcommon features stay off until a slice needs them;
# `system` keeps the libwayland-client backend that GPU presentation requires.
# Its `reexports::protocols` provides fractional-scale and viewporter.
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["system"] }
# The GPU (ADR 0001): Vulkan first, then GL (gles), shaders in WGSL only. No
# DX12/Metal/WebGPU backends; `raw-window-handle` comes re-exported as `wgpu::rwh`.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
# The client <-> daemon session protocol is length-prefixed JSON frames
# (src/protocol). serde is in the decided core set (spec §4.11) and the provider
# protocol (§4.8) and the JSONC config (§4.9) need it too; serde_json saves a
# hand-written JSON parser and escaper.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# Already in the tree through wayland-client; the `stdio` feature adds dup2 so
# a daemon started by a client can move its stderr off the client's pipe once
# listening (libraries such as wayland-backend print to stderr, and printing
# to a broken pipe panics). The `time` feature reads CLOCK_MONOTONIC for the
# test trace (src/window/trace.rs), which std's opaque Instant cannot give a
# harness in another process. `fs` (inotify) and `event` (poll) let the
# daemon watch its config file for live reload (src/config) without a crate.
rustix = { version = "1.1.5", features = ["stdio", "time", "fs", "event", "process"] }
# SVG icons (spec §4.3/§4.7). Defaults off: icons need no <text> (no font
# database, shaping or system font scan), no .svgz (flate2) and no embedded
# GIF/WebP/JPEG. PNG icons decode through its re-exported tiny-skia, whose
# default `png-format` feature is already in the tree, so no image crate.
resvg = { version = "0.48.1", default-features = false }
# Text (spec §4.4): glyphon's GPU glyph atlas over cosmic-text (shaping,
# bidi, swash rasterisation with hinting); tracks wgpu 30. Fonts come from
# libfontconfig through logis's own small FFI (src/text/fc.rs), not a crate.
glyphon = "0.12.0"
# Keyboard input (spec §4.5): libxkbcommon through the binding sctk's own
# keyboard integration uses (the decided stack: "libxkbcommon (sctk),
# xkbcommon crate"). Used directly rather than through sctk's `xkbcommon`
# feature: shortcuts need the xkb state's consumed modifiers, Compose must be
# reset on focus and keymap changes, and repeat must run without sctk's
# calloop timers; sctk's KeyboardHandler exposes none of that. `wayland`
# maps the compositor's keymap fd (memmap2, already in the tree).
xkbcommon = { version = "0.8.0", default-features = false, features = ["wayland"] }
# Grapheme-aware query editing (spec §4.4: Backspace deletes a grapheme);
# already in the tree through cosmic-text (same release).
unicode-segmentation = "1.13.3"
# fzf-like fuzzy matching (spec §4.5): the matcher engine of nucleo (the
# decided crate), without nucleo's high-level worker, which would add rayon
# and crossbeam (five crates) for what std::thread::scope does here
# (src/list/filter.rs). Default features: Unicode case folding and
# normalisation (case- and accent-insensitive) and grapheme segmentation
# (unicode-segmentation, already a dependency). MPL-2.0, used unmodified.
nucleo-matcher = "0.3.1"
# Only to name `Script` in cosmic-text's `Fallback` trait; already in the tree
# through cosmic-text (same 0.5 release), so it adds no crate.
unicode-script = "0.5.8"

# research/proto-rust is a separate, disposable Cargo package. Keeping the root
# an explicit workspace that excludes it means neither cargo invocation captures
# the other.
[workspace]
exclude = ["research/proto-rust"]

[dev-dependencies]
# Goldens are checked-in PNGs (compressed, viewable in any tool and on
# GitHub); a PNG decoder needs inflate, which std lacks. The same release the
# text and icon slices use, so the tree holds one copy.
png = "0.18"
# Already in the tree; for the E2E harness's isolation guard (`net`: the
# peer credentials of the compositor socket) and its dispatch deadline
# (`event`: poll), which std does not offer.
rustix = { version = "1.1.5", features = ["net", "event"] }
