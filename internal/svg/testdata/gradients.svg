<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="a"><stop offset="0" stop-color="#e8c070"/><stop offset=".5" stop-color="#a01818" stop-opacity=".6"/><stop offset="1" stop-color="#202020"/></linearGradient>
    <linearGradient id="b" xlink:href="#a" gradientUnits="userSpaceOnUse" x1="4" y1="36" x2="28" y2="60" spreadMethod="reflect"/>
    <!-- a repeating gradient without seams: point sampling and the oversampled oracle agree -->
    <linearGradient id="c" gradientTransform="rotate(30 .5 .5)" spreadMethod="repeat" x2=".4"><stop offset="0" stop-color="#e8c070"/><stop offset=".5" stop-color="#202020"/><stop offset="1" stop-color="#e8c070"/></linearGradient>
    <radialGradient id="r" cx="48" cy="16" r="14" fx="42" fy="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#2fd060"/></radialGradient>
    <radialGradient id="s" xlink:href="#a" r=".3" spreadMethod="reflect"/>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="4" fill="url(#a)"/>
  <circle cx="48" cy="16" r="14" fill="url(#r)"/>
  <rect x="4" y="36" width="24" height="24" fill="url(#b)"/>
  <ellipse cx="48" cy="48" rx="14" ry="10" fill="url(#c)" stroke="url(#s)" stroke-width="3"/>
</svg>
