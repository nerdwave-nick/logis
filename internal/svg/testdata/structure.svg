<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="48" height="48" viewBox="0 0 96 96">
  <style>.hull { fill: #2f6fd0; stroke: #0a1a40; stroke-width: 3 } #eye { fill: #f0f0f0 }</style>
