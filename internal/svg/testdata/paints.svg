<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <defs>
    <pattern id="stripes" width="64" height="12" patternUnits="userSpaceOnUse">
      <rect width="64" height="6" fill="#a01818"/>
      <rect y="6" width="64" height="6" fill="#e8c070"/>
    </pattern>
    <pattern id="dots" width=".25" height=".25" patternContentUnits="objectBoundingBox" patternTransform="rotate(20)">
